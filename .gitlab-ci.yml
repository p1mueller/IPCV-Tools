image: python:3.8.10

dependencies:
  stage: build
  script:
    - apt update && apt install -y graphviz graphviz-dev
    - python3 -m pip install doit pygraphviz import_deps
    - doit -n 5 -P thread uml draw
  artifacts:
    paths:
      - dependencies.png
      - classes.png

python:
  stage: test
  before_script:
    - python3 -m pip install ".[dev]"
  script:
    - doit codestyle
    - doit test

