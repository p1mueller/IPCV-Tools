image: ghcr.io/astral-sh/uv:debian-slim

before_script:
  - uv sync

codestyle:
  stage: test
  script:
    - uv run mypy ipcv_tools examples --ignore-missing-imports --disallow-untyped-defs --follow-imports skip

pytest:
  stage: test
  script:
    - uv pip install -e .
    - uv run pytest -v --junitxml=report.xml tests
  artifacts:
    when: always
    reports:
      junit: report.xml

dependencies:
  stage: deploy
  before_script:
    - uv sync
    - apt update && apt install -y graphviz graphviz-dev
  script:
    - uv run pyreverse -k -my -o png ipcv_tools/**.py
  artifacts:
    paths:
      - packages.png
      - classes.png

distribution:
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    TWINE_USERNAME: gitlab-ci-token
    TWINE_PASSWORD: $CI_JOB_TOKEN
  script:
    - uv pip install twine
    - uv build
    - uv run twine upload --repository-url ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi dist/*
