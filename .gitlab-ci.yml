image: python:3.8.10
before_script:
  - apt update && apt install -y graphviz graphviz-dev
  - python3 -m pip install doit pygraphviz import_deps pylint

dependencies:
  stage: build
  script:
    - doit -n 5 -P thread uml draw
  artifacts:
    paths:
      - dependencies.png
      - classes.png

python:
  stage: test
  script:
    - python3 -m pip install -e ".[dev]"
    - doit codestyle
    - doit test

