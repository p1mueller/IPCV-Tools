image: ghcr.io/astral-sh/uv:debian-slim

codestyle:
  stage: test
  script:
    - uv sync && source .venv/bin/activate
    - python3 -m mypy ipcv_tools examples --ignore-missing-imports --disallow-untyped-defs --follow-imports skip

pytest:
  stage: test
  script:
    - uv sync && source .venv/bin/activate
    - python3 -m pytest -v --junitxml=report.xml tests
  artifacts:
    when: always
    reports:
      junit: report.xml

dependencies:
  stage: deploy
  image: python:3.11
  before_script:
    - apt update && apt install -y graphviz graphviz-dev
    - python3 -m pip install pygraphviz pylint
  script:
    - pyreverse -k -my -o png ipcv_tools/**.py
  artifacts:
    paths:
      - packages.png
      - classes.png

distribution:
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    TWINE_USERNAME: gitlab-ci-token
    TWINE_PASSWORD: $CI_JOB_TOKEN
  script:
    - python3 -m pip install twine
    - uv build
    - python3 -m twine upload --repository-url ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi dist/*
