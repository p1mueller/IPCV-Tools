site_name: ipcv-tools
site_description: Image processing & computer vision pipelines for Python Pipeline-building framework Live QT/pygame viewers GenICam/Webcam support Buffering, FPS, UI widgets and is easy to extend with custom processing.

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - search.highlight

markdown_extensions:
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details

plugins:
  - search
  - autorefs
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths:
            - src
          options:
            filters: ["!^_"]
            heading_level: 1
            merge_init_into_class: true
            parameter_headings: true
            separate_signature: true
            relative_crossrefs: true
            show_root_heading: true
            show_signature_annotations: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            summary: true
            extensions:
              - griffe_pydantic:
                schema: true
  - api-autonav:
      modules: ["ipcv_tools"]
      module_options: {}
      nav_section_title: "API Reference"
      api_root_uri: "reference"
      nav_item_prefix: "<code class='doc-symbol doc-symbol-nav'></code>"
      exclude_private: true
      show_full_namespace: false
      on_implicit_namespace_package: "warn"

nav:
  - Home: index.md
  - Getting started: getting_started.md
