[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ipcv_tools"
version = "0.0.1"
description = "Image processing and computer vision pipelines with live Qt / pygame viewers."
readme = "README.md"
authors = [{ name = "Patrik Mueller", email = "patrik.mueller@ost.ch" }]
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.13"
keywords = ["computer-vision", "image-processing", "genicam", "opencv", "pipeline"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Scientific/Engineering :: Image Processing",
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "harvesters>=1.4.3",
  "matplotlib>=3.7.5",
  "numpy>=1.24.4",
  "opencv-python>=4.11.0.86",
  "pygame>=2.6.1",
  "pyqt5>=5.15.11",
  "pyqtgraph>=0.13.3",
  "scikit-image>=0.21.0",
  "scipy>=1.10.1",
]

[project.optional-dependencies]
dev = [
  "mypy==1.15.0",
  "pre-commit>=3.5.0",
  "pylint>=3.2.7",
  "pyqt5-stubs>=5.15.6.0",
  "pytest>=8.3.5",
  "pytest-cov>=7.1.0",
  "ruff>=0.11.2",
]

[dependency-groups]
dev = [
  "griffe-pydantic>=1.3.1",
  "mkdocs>=1.6",
  "mkdocs-api-autonav>=0.4.0",
  "mkdocs-autoapi>=0.4.1",
  "mkdocs-material>=9.6",
  "mkdocstrings[python]>=0.29",
  "mypy==1.15.0",
  "pre-commit>=3.5.0",
  "pylint>=3.2.7",
  "pyqt5-stubs>=5.15.6.0",
  "pytest>=8.3.5",
  "pytest-cov>=7.1.0",
  "ruff>=0.11.2",
]

[tool.setuptools]
packages = ["ipcv_tools"]

[tool.setuptools.package-data]
ipcv_tools = ["data/*"]

[tool.ruff]
line-length = 90
target-version = "py39"

[tool.ruff.lint]
select = ["F", "E", "W", "D", "I"]
ignore = ["E203", "E501", "D105", "D202", "D203", "D213", "D413"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
ignore_missing_imports = true

[tool.coverage.run]
source = ["ipcv_tools"]
branch = true

[tool.coverage.report]
exclude_lines = [
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
  "raise NotImplementedError(.*)",
]
show_missing = true
