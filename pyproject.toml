[project]
name = "ipcv_tools"
version = "0.0.1"
authors = [
  { name = "Patrik Mueller", email = "patrik.mueller@ost.ch" }
]
requires-python = ">=3.9,<3.12"
dependencies = [
    "harvesters>=1.4.3",
    "matplotlib>=3.7.5",
    "mypy>=1.0.0",
    "numpy>=1.24.4",
    "opencv-python>=4.11.0.86",
    "pygame>=2.6.1",
    "pyqt5>=5.15.11",
    "pyqtgraph>=0.13.3",
    "scikit-image>=0.21.0",
    "scipy>=1.10.1",
]

[tool.setuptools]
packages = ["ipcv_tools"]

[dependency-groups]
dev = [
    "mypy==1.15.0",
    "pre-commit>=3.5.0",
    "pylint>=3.2.7",
    "pyqt5-stubs>=5.15.6.0",
    "pytest>=8.3.5",
    "pytest-cov>=7.1.0",
    "ruff>=0.11.2",
]

[tool.ruff]
line-length = 90
target-version = "py39"

[tool.ruff.lint]
select = ["F", "E", "W", "D", "I"]
ignore = ["E203", "E501", "D105", "D202", "D203", "D213", "D413"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.coverage.run]
source = ["ipcv_tools"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "raise NotImplementedError(.*)",
]
show_missing = true
